<svg xmlns="http://www.w3.org/2000/svg" width="350" height="200" viewBox="0 0 350 200" fill="none">
  <style>
    .title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 16px; font-weight: 700; fill: #38bdf8; }
    .card { fill: #0d1117; stroke: #30363d; stroke-width: 1px; rx: 10px; }
  </style>
  <rect class="card" width="350" height="200" rx="10" />
  
  <!-- Header -->
  <g transform="translate(25, 35)">
    <path d="M0 -4 L6 2 L0 8 M10 -4 L4 2 L10 8" stroke="#38bdf8" stroke-width="2" fill="none" stroke-linecap="round"/>
    <text x="20" y="4" class="title">Most Used Languages</text>
  </g>

  <!-- Progress Bar Container -->
  <rect x="25" y="65" width="300" height="10" rx="5" fill="#21262d" />
  <g clip-path="url(#bar-clip)">
    <clipPath id="bar-clip">
      <rect x="25" y="65" width="300" height="10" rx="5" />
    </clipPath>
    <rect x="25.0" y="65" width="150.0" height="10" fill="#f1e05a" />
    <rect x="175.0" y="65" width="58.3" height="10" fill="#3178c6" />
    <rect x="233.3" y="65" width="41.7" height="10" fill="#e34c26" />
    <rect x="275.0" y="65" width="33.3" height="10" fill="#3572A5" />
    <rect x="308.3" y="65" width="16.7" height="10" fill="#563d7c" />
  </g>

  <!-- Legends -->
  <g>
    
      <circle cx="30" cy="95" r="5" fill="#f1e05a" />
      <text x="43" y="99" fill="#c9d1d9" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="13" font-weight="600">JavaScript</text>
      <text x="140" y="99" fill="#8b949e" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="12">50.0%</text>
    

      <circle cx="180" cy="95" r="5" fill="#3178c6" />
      <text x="193" y="99" fill="#c9d1d9" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="13" font-weight="600">TypeScript</text>
      <text x="290" y="99" fill="#8b949e" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="12">19.4%</text>
    

      <circle cx="30" cy="123" r="5" fill="#e34c26" />
      <text x="43" y="127" fill="#c9d1d9" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="13" font-weight="600">HTML</text>
      <text x="140" y="127" fill="#8b949e" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="12">13.9%</text>
    

      <circle cx="180" cy="123" r="5" fill="#3572A5" />
      <text x="193" y="127" fill="#c9d1d9" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="13" font-weight="600">Python</text>
      <text x="290" y="127" fill="#8b949e" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="12">11.1%</text>
    

      <circle cx="30" cy="151" r="5" fill="#563d7c" />
      <text x="43" y="155" fill="#c9d1d9" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="13" font-weight="600">CSS</text>
      <text x="140" y="155" fill="#8b949e" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="12">5.6%</text>
    
  </g>
</svg>